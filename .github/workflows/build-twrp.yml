name: Build TWRP for Apollo (Android 16 FBE Decrypt)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'apollo'
      manifest_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-16.0'
      lunch_target:
        description: 'Lunch target (without -eng)'
        required: true
        default: 'twrp_apollo'
      clean_build:
        description: 'Clean build (slower but safer)'
        type: boolean
        required: false
        default: true

env:
  MANIFEST_URL: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-16.0
  DEVICE_TREE_URL: https://github.com/PitchBlackRecoveryDevices/android_device_xiaomi_apollo
  DEVICE_TREE_BRANCH: android-10.0
  DEVICE_CODE: apollo
  LUNCH_TARGET: twrp_apollo
  USE_CCACHE: 1
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_EXEC: /usr/bin/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Display configuration
        run: |
          echo "============================================"
          echo "  TWRP Build for Apollo (Mi 10T / K30S Ultra)"
          echo "  Android 16 FBE Decryption Support"
          echo "============================================"
          echo "Device: ${{ github.event.inputs.device || 'apollo' }}"
          echo "Manifest: $MANIFEST_URL ($MANIFEST_BRANCH)"
          echo "Lunch: $LUNCH_TARGET-eng"
          echo "Runner: ubuntu-22.04 (2-core, 7GB RAM + 8GB swap)"
          echo "============================================"

      - name: Create swap space
        continue-on-error: true
        run: |
          echo "Creating 8GB swap file..."
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || echo "swap creation failed, continuing without swap"
          free -h

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo bc ccache rsync libssl-dev \
            liblz4-tool lz4 zstd

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-apollo-twrp-${{ github.sha }}
          restore-keys: |
            ccache-apollo-twrp-

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Initialize TWRP source
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init --depth=1 -u $MANIFEST_URL -b $MANIFEST_BRANCH
          repo sync -c --no-tags --no-clone-bundle -j4

      - name: Clone device tree
        run: |
          cd ~/android/twrp
          git clone --depth=1 -b $DEVICE_TREE_BRANCH $DEVICE_TREE_URL device/xiaomi/apollo

      - name: Clone TWRP Qualcomm common (for FBE decryption services)
        run: |
          cd ~/android/twrp
          git clone --depth=1 -b android-11 https://github.com/TeamWin/android_device_qcom_twrp-common.git device/qcom/twrp-common

      - name: Patch device tree for Android 16 compatibility
        run: |
          cd ~/android/twrp

          cat > device/xiaomi/apollo/AndroidProducts.mk << 'PRODUCTEOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_apollo.mk
          COMMON_LUNCH_CHOICES := \
              twrp_apollo-eng
          PRODUCTEOF

          if [ -f device/xiaomi/apollo/omni_apollo.mk ]; then
            cp device/xiaomi/apollo/omni_apollo.mk device/xiaomi/apollo/twrp_apollo.mk
          fi

          cat >> device/xiaomi/apollo/BoardConfig.mk << 'BCFGEOF'

          # === Android 16 FBE Decryption Patches ===
          BOARD_USES_QCOM_FBE_DECRYPTION := true
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          TW_INCLUDE_FBE_METADATA_DECRYPT := true
          TW_USE_FSCRYPT_POLICY := 2
          BOARD_USES_METADATA_PARTITION := true
          BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE := true
          BOARD_RAMDISK_USE_LZ4 := true
          BOARD_USES_RECOVERY_AS_BOOT := false
          AB_OTA_UPDATER := true
          BOARD_AVB_ENABLE := true
          TW_FORCE_SELINUX_PERMISSIVE := true
          TW_NO_AUTO_DECRYPT := true
          BOARD_SUPER_PARTITION_SIZE := 9126805504
          BOARD_SUPER_PARTITION_GROUPS := qti_dynamic_partitions
          BOARD_QTI_DYNAMIC_PARTITIONS_SIZE := 9126805504
          BOARD_QTI_DYNAMIC_PARTITIONS_PARTITION_LIST := product vendor system system_ext odm
          BCFGEOF

          cat >> device/xiaomi/apollo/twrp_apollo.mk << 'TWRPEOF'

          # === Android 16 TWRP additions ===
          $(call inherit-product, device/qcom/twrp-common/twrp-common.mk)

          PRODUCT_PACKAGES += \
              qseecomd \
              prepdecrypt.sh \
              init.recovery.qcom_decrypt.rc
          TWRPEOF

          echo "=== Patched files ==="
          cat device/xiaomi/apollo/AndroidProducts.mk
          echo "---"
          tail -30 device/xiaomi/apollo/BoardConfig.mk

      - name: Build recovery image
        run: |
          cd ~/android/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_DUP_RULES=true
          export BUILD_BROKEN_USES_BUILD_COPY_FILES=true
          source build/envsetup.sh
          lunch $LUNCH_TARGET-eng
          mka recoveryimage -j2 2>&1 | tee /tmp/build_full.log | tail -500
          echo "=== Build completed, checking output ==="

      - name: Check build output
        run: |
          cd ~/android/twrp
          if [ -f out/target/product/apollo/recovery.img ]; then
            echo "=== BUILD SUCCESSFUL ==="
            ls -la out/target/product/apollo/recovery.img
            md5sum out/target/product/apollo/recovery.img
          else
            echo "=== BUILD FAILED ==="
            echo "Looking for recovery.img..."
            find out/ -name "recovery.img" 2>/dev/null || echo "No recovery.img found"
            echo ""
            echo "Last 200 lines of build log:"
            tail -200 /tmp/build_full.log 2>/dev/null || echo "No build log found"
            exit 1
          fi

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-apollo-android16-recovery
          path: ~/android/twrp/out/target/product/apollo/recovery.img
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-apollo
          path: /tmp/build_full.log
          retention-days: 7
          if-no-files-found: ignore
