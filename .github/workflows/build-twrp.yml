name: Build TWRP for Apollo (Android 16 FBE Decrypt)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'apollo'
      manifest_branch:
        description: 'TWRP manifest branch'
        required: true
        default: 'twrp-16.0'
      lunch_target:
        description: 'Lunch target (without -eng)'
        required: true
        default: 'twrp_apollo'
      clean_build:
        description: 'Clean build (slower but safer)'
        type: boolean
        required: false
        default: true

env:
  MANIFEST_URL: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-16.0
  DEVICE_TREE_URL: https://github.com/PitchBlackRecoveryDevices/android_device_xiaomi_apollo
  DEVICE_TREE_BRANCH: android-10.0
  DEVICE_CODE: apollo
  LUNCH_TARGET: twrp_apollo
  USE_CCACHE: 1
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_EXEC: /usr/bin/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Display configuration
        run: |
          echo "============================================"
          echo "  TWRP Build for Apollo (Mi 10T / K30S Ultra)"
          echo "  Android 16 FBE Decryption Support"
          echo "============================================"
          echo "Device: ${{ github.event.inputs.device || 'apollo' }}"
          echo "Manifest: $MANIFEST_URL ($MANIFEST_BRANCH)"
          echo "Lunch: twrp_apollo-bp2a-eng"
          echo "Runner: ubuntu-22.04 (2-core, 7GB RAM + 8GB swap)"
          echo "============================================"

      - name: Create swap space
        run: |
          echo "Creating 8GB swap file..."
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap created successfully:"
          free -h

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo bc ccache rsync libssl-dev \
            liblz4-tool lz4 zstd

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-apollo-twrp-${{ github.sha }}
          restore-keys: |
            ccache-apollo-twrp-

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Initialize TWRP source
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init --depth=1 -u $MANIFEST_URL -b $MANIFEST_BRANCH
          repo sync -c --no-tags --no-clone-bundle -j4

      - name: Clone device tree
        run: |
          cd ~/android/twrp
          git clone --depth=1 -b $DEVICE_TREE_BRANCH $DEVICE_TREE_URL device/xiaomi/apollo

      - name: Clone TWRP Qualcomm common (for FBE decryption services)
        run: |
          cd ~/android/twrp
          git clone --depth=1 -b android-11 https://github.com/TeamWin/android_device_qcom_twrp-common.git device/qcom/twrp-common

      - name: Rewrite device tree for Android 16 TWRP
        run: |
          cd ~/android/twrp
          DEVICE_PATH=device/xiaomi/apollo

          echo "=== Backing up original files ==="
          cp $DEVICE_PATH/BoardConfig.mk $DEVICE_PATH/BoardConfig.mk.bak
          cp $DEVICE_PATH/omni_apollo.mk $DEVICE_PATH/omni_apollo.mk.bak 2>/dev/null || true

          echo "=== Rewriting AndroidProducts.mk ==="
          cat > $DEVICE_PATH/AndroidProducts.mk << 'APMKEOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_apollo.mk

          COMMON_LUNCH_CHOICES := \
              twrp_apollo-bp2a-eng
          APMKEOF

          echo "=== Rewriting twrp_apollo.mk ==="
          cat > $DEVICE_PATH/twrp_apollo.mk << 'PRODEOF'
          #
          # TWRP product configuration for Xiaomi Mi 10T / Redmi K30S Ultra (apollo)
          # Compatible with Android 16 TWRP build system
          #

          PRODUCT_RELEASE_NAME := apollo
          DEVICE_PATH := device/xiaomi/apollo

          # Inherit core minimal product
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_minimal.mk)

          # Device identifier
          PRODUCT_DEVICE := apollo
